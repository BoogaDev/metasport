name: metasport
services:
  - name: web
    dockerfile_path: Dockerfile
    http_port: 8000
    envs:
      - key: APISPORTS_KEY
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SERVICE_ROLE
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SCHEMA
        value: public
        scope: RUN_AND_BUILD_TIME
      - key: TZ
        value: America/New_York
        scope: RUN_AND_BUILD_TIME
    health_check:
      http_path: /health
    routes:
      - path: /

jobs:
  - name: schedule-cron
    kind: cron
    dockerfile_path: Dockerfile
    schedule: "0 */2 * * *"  # every 2 hours
    envs:
      - key: CMD
        value: "python -m src.cli schedule --date today"
      - key: APISPORTS_KEY
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SERVICE_ROLE
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SCHEMA
        value: public
      - key: TZ
        value: America/New_York
    run_command: "/bin/sh -lc \"$CMD\""

  - name: scores-cron
    kind: cron
    dockerfile_path: Dockerfile
    schedule: "*/2 * * * *"  # every 2 minutes
    envs:
      - key: CMD
        value: "python -m src.cli scores"
      - key: APISPORTS_KEY
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SERVICE_ROLE
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SCHEMA
        value: public
      - key: TZ
        value: America/New_York
    run_command: "/bin/sh -lc \"$CMD\""

  - name: odds-am-cron
    kind: cron
    dockerfile_path: Dockerfile
    schedule: "0 9 * * *"  # 9am ET daily
    envs:
      - key: CMD
        value: "python -m src.cli odds --date today"
      - key: ODDS_API_KEY
        scope: RUN_AND_BUILD_TIME
      - key: ODDS_API_REGIONS
        value: us
        scope: RUN_AND_BUILD_TIME
      - key: APISPORTS_KEY
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SERVICE_ROLE
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SCHEMA
        value: public
      - key: TZ
        value: America/New_York
    run_command: "/bin/sh -lc \"$CMD\""

  - name: odds-pregame-cron
    kind: cron
    dockerfile_path: Dockerfile
    schedule: "*/5 * * * *"  # every 5 minutes to reliably hit T-1h window
    envs:
      - key: CMD
        value: "python -m src.cli odds_pregame"
      - key: ODDS_API_KEY
        scope: RUN_AND_BUILD_TIME
      - key: ODDS_API_REGIONS
        value: us
        scope: RUN_AND_BUILD_TIME
      - key: APISPORTS_KEY
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SERVICE_ROLE
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SCHEMA
        value: public
      - key: TZ
        value: America/New_York
    run_command: "/bin/sh -lc \"$CMD\""


